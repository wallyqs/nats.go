\* REQ-2 with the proposed fix, liveness: with no deadline, a request issued
\* after the mux was unsubscribed re-creates it and is served.
SPECIFICATION Spec
CONSTANTS
    Req = {r1, r2}
    NoReq = NoReq
    MaxAttempts = 2
    ChanCap = 1
    MaxReplies = 1
    Styles = {"new"}
    WithTimeouts = FALSE
    WithPubFail = FALSE
    WithForeign = FALSE
    WithClose = FALSE
    MaxDisconnects = 0
    WithUserUnsubMux = TRUE
    FixLeak = FALSE
    FixMuxReset = TRUE
INVARIANTS
    TypeOK
    MuxValid
PROPERTIES
    LaterWaitersServed
