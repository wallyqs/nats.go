\* No deadlines (RequestWithContext(context.Background())), no Close: every
\* request whose responder answers is eventually served, across a drop.
SPECIFICATION Spec
CONSTANTS
    Req = {r1, r2}
    NoReq = NoReq
    MaxAttempts = 2
    ChanCap = 1
    MaxReplies = 1
    Styles = {"new", "old"}
    WithTimeouts = FALSE
    WithPubFail = FALSE
    WithForeign = FALSE
    WithClose = FALSE
    MaxDisconnects = 1
    WithUserUnsubMux = FALSE
    FixLeak = FALSE
    FixMuxReset = FALSE
INVARIANTS
    TypeOK
    NoLeak
    MuxValid
PROPERTIES
    WaitersServed
    AllRequestsReturn
