\* Old style (UseOldRequestStyle) mixed with new style, one request per
\* goroutine, duplicate replies, one connection drop, Close at any point.
SPECIFICATION Spec
CONSTANTS
    Req = {r1, r2}
    NoReq = NoReq
    MaxAttempts = 1
    ChanCap = 1
    MaxReplies = 2
    Styles = {"new", "old"}
    WithTimeouts = TRUE
    WithPubFail = FALSE
    WithForeign = FALSE
    WithClose = TRUE
    MaxDisconnects = 1
    WithUserUnsubMux = FALSE
    FixLeak = FALSE
    FixMuxReset = FALSE
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoSendOnClosed
    HandlerNeverBlocks
    OneSendPerRequest
    NoMisdelivery
    NoLeak
    CloseReleasesWaiters
    MuxCreatedOnce
    MuxValid
