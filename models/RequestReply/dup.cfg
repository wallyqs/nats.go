\* New style with duplicate replies (two responders, or reply + 503), late
\* replies after timeout, one connection drop, Close at any point.
SPECIFICATION Spec
CONSTANTS
    Req = {r1, r2}
    NoReq = NoReq
    MaxAttempts = 1
    ChanCap = 1
    MaxReplies = 2
    Styles = {"new"}
    WithTimeouts = TRUE
    WithPubFail = FALSE
    WithForeign = FALSE
    WithClose = TRUE
    MaxDisconnects = 1
    WithUserUnsubMux = FALSE
    FixLeak = FALSE
    FixMuxReset = FALSE
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoSendOnClosed
    HandlerNeverBlocks
    OneSendPerRequest
    NoMisdelivery
    NoLeak
    CloseReleasesWaiters
    MuxCreatedOnce
    MuxValid
