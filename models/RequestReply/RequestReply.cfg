\* Baseline safety, new style: two goroutines, two sequential requests each,
\* replies and 503s, one connection drop, Close at any point.
SPECIFICATION Spec
CONSTANTS
    Req = {r1, r2}
    NoReq = NoReq
    MaxAttempts = 2
    ChanCap = 1
    MaxReplies = 1
    Styles = {"new"}
    WithTimeouts = TRUE
    WithPubFail = FALSE
    WithForeign = FALSE
    WithClose = TRUE
    MaxDisconnects = 1
    WithUserUnsubMux = FALSE
    FixLeak = FALSE
    FixMuxReset = FALSE
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoSendOnClosed
    HandlerNeverBlocks
    OneSendPerRequest
    NoMisdelivery
    NoLeak
    CloseReleasesWaiters
    MuxCreatedOnce
    MuxValid
