\* All fix/pub fixes but not the fix/conn nats.go change (FIX_StatusProbe = FALSE): the PUB-5 fix relies on the CLOSED event reaching the reconnect worker, and the old sendStatusEvent probe eats a buffered RECONNECTING and unregisters the listener for CLOSED (PUB-7a), stranding a future. Expected to violate NoStrandedFuture until FIX_StatusProbe.
