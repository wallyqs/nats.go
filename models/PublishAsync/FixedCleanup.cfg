\* All proposed fixes; cleanup/stall/listener side: max-pending stall, CleanupPublisher, a disconnect, close (PUB7_status_probe_deaf_bug.cfg with FIX_StatusProbe covers two disconnects).
SPECIFICATION Spec
CONSTANTS
    Calls = {c1,c2}
    MaxPA = 1
    MaxRetries = 0
    UseTimeout = FALSE
    HasErrCb = TRUE
    ReentrantCb = FALSE
    RespKinds = {"ok"}
    MaxDisc = 1
    AllowClose = TRUE
    MaxCleanup = 1
    MaxComplete = 1
    NoReconnectBuf = FALSE
    UserErr = FALSE
    FIX_TimeoutCb = TRUE
    FIX_CleanupUnstall = TRUE
    FIX_SyncFailDone = TRUE
    FIX_RetryOwner = TRUE
    FIX_CloseResolves = TRUE
    FIX_CleanupPrefix = TRUE
    FIX_StatusProbe = TRUE
SYMMETRY Symm
INVARIANTS
    MaxPendingRespected
    ResolvedAtMostOnce
    ErrCbAtMostOnce
    SingleReport
    NoBlockedSendUnderLock
    NoSelfDeadlock
    NoLostStallWakeup
    NoLostCompletion
    NoOrphanedFuture
    ListenerSubscribed
    NoLeakedResetGoroutine
    NoStrandedFuture
