\* PUB-4: the retry error path resolves a future that a reconnect already failed; the 2nd send blocks under the lock.
SPECIFICATION Spec
CONSTANTS
    Calls = {1}
    MaxPA = 1
    MaxRetries = 1
    UseTimeout = FALSE
    HasErrCb = TRUE
    ReentrantCb = FALSE
    RespKinds = {"nr"}
    MaxDisc = 1
    AllowClose = FALSE
    MaxCleanup = 0
    MaxComplete = 0
    NoReconnectBuf = TRUE
    UserErr = TRUE
    FIX_TimeoutCb = FALSE
    FIX_CleanupUnstall = FALSE
    FIX_SyncFailDone = FALSE
    FIX_RetryOwner = FALSE
    FIX_CloseResolves = FALSE
    FIX_CleanupPrefix = FALSE
    FIX_StatusProbe = FALSE
INVARIANTS
    NoBlockedSendUnderLock
