\* Today's code under weak fairness, without close and cleanup: every future is eventually resolved and every Complete channel eventually closes.
SPECIFICATION FairSpec
CONSTANTS
    Calls = {1}
    MaxPA = 1
    MaxRetries = 1
    UseTimeout = TRUE
    HasErrCb = TRUE
    ReentrantCb = FALSE
    RespKinds = {"ok","nr"}
    MaxDisc = 1
    AllowClose = FALSE
    MaxCleanup = 0
    MaxComplete = 1
    NoReconnectBuf = FALSE
    UserErr = FALSE
    FIX_TimeoutCb = FALSE
    FIX_CleanupUnstall = FALSE
    FIX_SyncFailDone = FALSE
    FIX_RetryOwner = FALSE
    FIX_CloseResolves = FALSE
    FIX_CleanupPrefix = FALSE
    FIX_StatusProbe = FALSE
PROPERTIES
    EventuallyResolved
    CompleteCloses
