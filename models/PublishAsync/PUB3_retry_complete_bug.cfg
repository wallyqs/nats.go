\* PUB-3 (retry): a 503 retry whose PublishMsg fails (closed connection) leaves PublishAsyncComplete open forever. FIX_SyncFailDone isolates the retry path.
SPECIFICATION Spec
CONSTANTS
    Calls = {1}
    MaxPA = 1
    MaxRetries = 1
    UseTimeout = FALSE
    HasErrCb = TRUE
    ReentrantCb = FALSE
    RespKinds = {"nr"}
    MaxDisc = 0
    AllowClose = TRUE
    MaxCleanup = 0
    MaxComplete = 1
    NoReconnectBuf = FALSE
    UserErr = FALSE
    FIX_TimeoutCb = FALSE
    FIX_CleanupUnstall = FALSE
    FIX_SyncFailDone = TRUE
    FIX_RetryOwner = FALSE
    FIX_CloseResolves = FALSE
    FIX_CleanupPrefix = FALSE
    FIX_StatusProbe = FALSE
INVARIANTS
    NoLostCompletion
