\* All proposed fixes; retry/timer/reconnect side: 503 retry, ack timer, re-entrant handler, reconnect buffer off (so publishes fail while reconnecting). Close is covered by FixedCleanup and FixedLiveness.
SPECIFICATION Spec
CONSTANTS
    Calls = {c1,c2}
    MaxPA = 1
    MaxRetries = 1
    UseTimeout = TRUE
    HasErrCb = TRUE
    ReentrantCb = TRUE
    RespKinds = {"ok","nr"}
    MaxDisc = 1
    AllowClose = FALSE
    MaxCleanup = 0
    MaxComplete = 1
    NoReconnectBuf = TRUE
    UserErr = FALSE
    FIX_TimeoutCb = TRUE
    FIX_CleanupUnstall = TRUE
    FIX_SyncFailDone = TRUE
    FIX_RetryOwner = TRUE
    FIX_CloseResolves = TRUE
    FIX_CleanupPrefix = TRUE
    FIX_StatusProbe = TRUE
SYMMETRY Symm
INVARIANTS
    MaxPendingRespected
    ResolvedAtMostOnce
    ErrCbAtMostOnce
    SingleReport
    NoBlockedSendUnderLock
    NoSelfDeadlock
    NoLostStallWakeup
    NoLostCompletion
    NoOrphanedFuture
    ListenerSubscribed
    NoLeakedResetGoroutine
    NoStrandedFuture
