\* All proposed fixes under weak fairness: every future is eventually resolved and every Complete channel eventually closes, even across a 503 retry, a reconnect, a close and a cleanup.
SPECIFICATION FairSpec
CONSTANTS
    Calls = {1}
    MaxPA = 1
    MaxRetries = 1
    UseTimeout = FALSE
    HasErrCb = TRUE
    ReentrantCb = FALSE
    RespKinds = {"ok","nr"}
    MaxDisc = 1
    AllowClose = TRUE
    MaxCleanup = 1
    MaxComplete = 1
    NoReconnectBuf = TRUE
    UserErr = FALSE
    FIX_TimeoutCb = TRUE
    FIX_CleanupUnstall = TRUE
    FIX_SyncFailDone = TRUE
    FIX_RetryOwner = TRUE
    FIX_CloseResolves = TRUE
    FIX_CleanupPrefix = TRUE
    FIX_StatusProbe = TRUE
PROPERTIES
    EventuallyResolved
    CompleteCloses
