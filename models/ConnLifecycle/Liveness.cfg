\* SPEC: ConnLifecycle
\* Liveness under weak fairness of the client goroutines: Close ends doReconnect and the callback dispatcher. All fixes on.
SPECIFICATION FairSpec
CONSTANTS
    Flushes = {1}
    MaxSock = 3
    MaxDrops = 1
    MaxReconnect = 2
    MaxTimer = 1
    MaxPingsOut = 1
    MaxForce = 1
    AllowClose = TRUE
    AllowWriteFail = TRUE
    AllowHsFail = TRUE
    AllowDialFail = TRUE
    AllowFlushTimeout = FALSE
    FixStalePong = TRUE
    FixPendingFail = TRUE
    FixRqch = TRUE
    FixHsClose = TRUE
    FixCloseDisc = TRUE
    FixDiscPush = TRUE
PROPERTIES
    CloseTerminates
    ReconnectNotStuck
