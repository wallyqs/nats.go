\* SPEC: StatusListener
\* Status listener channel: user reads late, closes it, or removes it. Both fixes on.
SPECIFICATION Spec
CONSTANTS
    Cap = 2
    Statuses = {"CONNECTED", "RECONNECTING", "CLOSED"}
    Emittable = {"CONNECTED", "RECONNECTING", "CLOSED", "CONNECTING"}
    MaxEvents = 4
    FixProbe = TRUE
    FixRemove = TRUE
INVARIANTS
    NoEventStolen
    StaysRegistered
    RemoveCloses
    NoLossBelowCap
