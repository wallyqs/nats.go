\* SPEC: ConnLifecycle
\* Flush/PING-PONG with the ping timer (stale connection) and flush timeouts, no ForceReconnect: all fixes on.
SPECIFICATION Spec
CONSTANTS
    Flushes = {1, 2}
    MaxSock = 3
    MaxDrops = 1
    MaxReconnect = 2
    MaxTimer = 2
    MaxPingsOut = 1
    MaxForce = 0
    AllowClose = TRUE
    AllowWriteFail = TRUE
    AllowHsFail = FALSE
    AllowDialFail = FALSE
    AllowFlushTimeout = TRUE
    FixStalePong = TRUE
    FixPendingFail = TRUE
    FixRqch = TRUE
    FixHsClose = TRUE
    FixCloseDisc = TRUE
    FixDiscPush = TRUE
INVARIANTS
    TypeOK
    FlushIntegrity
    WaitForExitsUnblocked
    NoSocketWhileBackingOff
    NoLeakedSocket
    BackoffRespected
    NoCallbackAfterClosed
    ClosedOnce
    NoDoubleDisconnect
    DisconnectReportedBeforeClosed
PROPERTIES
    StatusTransitions
