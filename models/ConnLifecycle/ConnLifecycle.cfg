\* Flush/PING-PONG, pending buffer, Close, one ForceReconnect, one ping (no stale timer): all fixes on.
SPECIFICATION Spec
CONSTANTS
    Flushes = {1, 2}
    MaxSock = 3
    MaxDrops = 1
    MaxReconnect = 2
    MaxTimer = 1
    MaxPingsOut = 1
    MaxForce = 1
    AllowClose = TRUE
    AllowWriteFail = TRUE
    AllowHsFail = FALSE
    AllowDialFail = FALSE
    AllowFlushTimeout = TRUE
    FixStalePong = TRUE
    FixPendingFail = TRUE
    FixRqch = TRUE
    FixHsClose = TRUE
    FixCloseDisc = TRUE
    FixDiscPush = TRUE
INVARIANTS
    TypeOK
    FlushIntegrity
    WaitForExitsUnblocked
    NoSocketWhileBackingOff
    NoLeakedSocket
    BackoffRespected
    NoCallbackAfterClosed
    ClosedOnce
    NoDoubleDisconnect
    DisconnectReportedBeforeClosed
PROPERTIES
    StatusTransitions
