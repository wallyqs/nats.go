\* SPEC: ConnLifecycle
\* CONN-5 (liveness): after a failed pending-buffer flush doReconnect waits forever unless the server drops the socket.
SPECIFICATION FairSpec
CONSTANTS
    Flushes = {1}
    MaxSock = 3
    MaxDrops = 1
    MaxReconnect = 2
    MaxTimer = 1
    MaxPingsOut = 1
    MaxForce = 1
    AllowClose = TRUE
    AllowWriteFail = TRUE
    AllowHsFail = FALSE
    AllowDialFail = FALSE
    AllowFlushTimeout = FALSE
    FixStalePong = FALSE
    FixPendingFail = FALSE
    FixRqch = FALSE
    FixHsClose = FALSE
    FixCloseDisc = FALSE
    FixDiscPush = FALSE
PROPERTIES
    ReconnectNotStuck
