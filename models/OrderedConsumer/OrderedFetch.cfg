\* SPEC: OrderedFetch
\* Fetch and FetchNoWait (FetchBytes and Next share Fetch's code), fixed
\* code (ORD-1, ORD-2); calls may overlap a running fetch: the cursor
\* hand-over keeps the order and every call returns with c.Mutex free.
\* Expected to pass.
CONSTANT Fixes <- AllFixes
SPECIFICATION Spec
CONSTANTS
    N = 5
    B = 2
    MaxCalls = 5
    Kinds = {"Fetch", "FetchNoWait"}
INVARIANTS
    InOrder
    LockFree
    CallsReturn
