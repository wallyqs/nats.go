\* SPEC: OrderedMessages
\* ORD-8 fixed: Next with a deadline while reset() retries on a connection
\* that stays down; the deadline bounds reset(), Next returns, and the next
\* call retries the reset. The trigger is the forced missed heartbeat rather
\* than the deletion of OrderedMessages_timeout_bug.cfg (MaxExtDel = 0): with
\* both, the full state space is too large for the liveness check. Without
\* the Fixes override this cfg still violates DeadlineHonored. Expected to
\* pass.
CONSTANT Fixes <- AllFixes
SPECIFICATION Spec
CONSTANTS
    N = 1
    SA = 0
    MaxSubs = 3
    MaxGaps = 0
    MaxHb = 0
    MaxExtDel = 0
    MaxSilent = 0
    MaxDisc = 1
    AllowClose = FALSE
    DownForever = TRUE
    MaxReset = 0
    AllowExpire = FALSE
    UserStops = FALSE
    Deadline = TRUE
    ShortDeadline = FALSE
PROPERTIES
    DeadlineHonored
ALIAS Alias
