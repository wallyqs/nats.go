\* Baseline safety: Consume with a lost message and a spurious missed
\* heartbeat (deletion: ExtDelete.cfg; reconnect: Reconnect.cfg). No user
\* Stop, no close, no StopAfter. Expected to pass.
CONSTANT Fixes <- AllFixes
SPECIFICATION Spec
CONSTANTS
    N = 2
    SA = 0
    MaxSubs = 4
    MaxGaps = 1
    MaxHb = 1
    MaxExtDel = 0
    MaxDisc = 0
    AllowClose = FALSE
    MaxCreateFail = 0
    MaxReset = 0
    UserStops = FALSE
    UserErrHandler = TRUE
    UserStopOn = {}
INVARIANTS
    BoundOK
    NoDupNoGap
    StopAfterBound
    NoSelfDeadlock
    NoSpuriousInvalid
    AtMostOneLive
    InOrder
    SerialHandler
ALIAS Alias
