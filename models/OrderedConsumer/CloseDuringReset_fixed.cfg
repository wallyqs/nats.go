\* ORD-7 fixed: the scenario of CloseDuringReset_bug.cfg with the fixed code;
\* reset() gives up on a closed connection and the consume ends with
\* ErrConnectionClosed. N = 0: messages play no part in the scenario, and
\* with N = 1 the state space (7.6M states) is too large for the liveness
\* check. Without the Fixes override this cfg still violates
\* CloseEndsConsume. Expected to pass.
CONSTANT Fixes <- AllFixes
SPECIFICATION Spec
CONSTANTS
    N = 0
    SA = 0
    MaxSubs = 3
    MaxGaps = 0
    MaxHb = 0
    MaxExtDel = 1
    MaxDisc = 0
    AllowClose = TRUE
    MaxCreateFail = 0
    MaxReset = 0
    UserStops = FALSE
    UserErrHandler = TRUE
    UserStopOn = {}
PROPERTIES
    CloseEndsConsume
ALIAS Alias
