\* SPEC: KVWatch
\* Today's code with only KV-8 fixed ("pendingerr"; without it TLC finds the
\* KV-8 stuck flavor here): IncludeHistory watchers recover from message
\* loss and a server restart — a reset from jsi.sseq+1 is exactly right for
\* DeliverAll, even from sequence 1. Shows the fault actions are not
\* over-reporting.
CONSTANTS
    a = a
    b = b
    Keys = {a, b}
    Filter = {a, b}
    KeysCap = 1
    ChanCap = 1
    ResumeRev = 2
    History = 2
    MaxSeq = 2
    Modes = {"ALL"}
    IgnoreOpts = {FALSE}
    Users = {"Watch"}
    MaxDrops = 1
    MaxRestarts = 1
    MaxRemoves = 0
    MaxCancels = 0
    InfoAtCreate = FALSE
    UserStops = FALSE
    Fixes = {"pendingerr"}
SPECIFICATION Spec
INVARIANTS
    Safety
    NoStuckInit
    Converged
    NoLeakAfterStop
