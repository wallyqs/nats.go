\* SPEC: PullMessages
\* PULL-8 (Messages): Next between Drain's closed.CompareAndSwap and
\* draining.Store reports ErrMsgIteratorClosed with messages buffered.
\* Fix "drainrace" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxNext = 3
  MaxReconnects = 0
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"drain"}
  NextTimeout = FALSE
  ReportMissingHB = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "pendingreset", "clamp", "buffered", "unbounded"}
INVARIANTS
  DrainKeepsBuffered
