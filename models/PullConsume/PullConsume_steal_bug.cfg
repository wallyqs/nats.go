\* SPEC: PullConsume
\* PULL-2: sendStatusEvent steals a buffered RECONNECTING when CONNECTED is
\* sent and unregisters CONNECTED; after the next reconnect (server lost the
\* pull) nobody re-pulls and the heartbeat timer is stopped: stuck for good.
\* Fix "steal" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 1
  MaxReconnects = 2
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {}
  AllowClose = FALSE
  ReqsOnDisconnect = "drop"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "stopafter", "pendingreset", "clamp", "drainrace", "closedch"}
INVARIANTS
  NoPermanentStall
