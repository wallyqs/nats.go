  MaxNext = 3
  MaxReconnects = 0
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {}
  NextTimeout = FALSE
  ReportMissingHB = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = FALSE
  FastPull = FALSE
  Fixes = {"orphan", "steal", "pendingreset", "clamp", "drainrace", "buffered", "unbounded"}
INVARIANTS
  NoSilentStall
