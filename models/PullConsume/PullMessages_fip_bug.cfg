\* SPEC: PullMessages
\* PULL-10 (model-only): checkPending skips while fetchInProgress is 1
\* (pull.go:467) and nothing calls it again if the server answers the pull
\* being sent (its last message or its 408) before pullMessages clears the
\* flag (pull.go:1092): the iterator waits for the heartbeat timer. Needs
\* FastPull = FALSE (pullMessages descheduled for a round trip). All fixes on.
