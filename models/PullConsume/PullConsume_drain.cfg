\* SPEC: PullConsume
\* Passing: Drain + Closed with every fix, one reconnect (the server may or
\* may not keep waiting pulls).
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"drain", "closed"}
  AllowClose = FALSE
  ReqsOnDisconnect = "keep"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "stopafter", "pendingreset", "clamp", "drainrace", "closedch", "fip"}
INVARIANTS
  TypeOK
  NoInvalidPull
  NoOrphanedFetchSend
  NoStuckSelfSend
  DrainNotDowngraded
  DrainProcessesBuffered
  ClosedMeansDone
  NoDeadlock
  NoPermanentStall
