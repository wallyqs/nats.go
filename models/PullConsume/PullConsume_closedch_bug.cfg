\* SPEC: PullConsume
\* PULL-7: Closed() reports closed as soon as the subscription is invalid,
\* while a callback may still run. Fix "closedch" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxReconnects = 0
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"stop", "closed"}
  AllowClose = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "stopafter", "pendingreset", "clamp", "drainrace"}
INVARIANTS
  ClosedMeansDone
