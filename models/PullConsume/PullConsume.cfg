\* Consume() with every proposed fix applied: all invariants hold.
\* Stop/Closed by the user, one disconnect/reconnect (the server may or may
\* not keep waiting pulls), late heartbeats allowed, 408 expiries.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"stop", "closed"}
  AllowClose = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = TRUE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "stopafter", "pendingreset", "clamp", "drainrace", "closedch"}
INVARIANTS
  TypeOK
  StopAfterRespected
  BatchWithinMax
  NoInvalidPull
  NoOrphanedFetchSend
  NoStuckSelfSend
  DrainNotDowngraded
  DrainProcessesBuffered
  ClosedMeansDone
  NoDeadlock
  NoPermanentStall
