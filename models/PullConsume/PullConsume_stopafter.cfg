\* SPEC: PullConsume
\* Passing: StopAfter(1) < MaxMessages(2) with every fix: never more than
\* StopAfter callbacks, never a batch < 1, never stalled waiting for the
\* heartbeat timer.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 1
  StreamMsgs = 2
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"stop"}
  AllowClose = FALSE
  ReqsOnDisconnect = "keep"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "stopafter", "pendingreset", "clamp", "drainrace", "closedch", "fip"}
INVARIANTS
  TypeOK
  StopAfterRespected
  BatchWithinMax
  NoInvalidPull
  NoOrphanedFetchSend
  NoDeadlock
  NoSilentStall
  NoPermanentStall
