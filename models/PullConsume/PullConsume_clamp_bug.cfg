\* SPEC: PullConsume
\* PULL-6: pending.msgCount goes negative (decrementPendingMsgs has no
\* floor) after a heartbeat re-pull overlaps the old pull, and checkPending
\* asks for more than MaxMessages. Fix "clamp" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxReconnects = 0
  MaxExpires = 2
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {}
  AllowClose = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = TRUE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "stopafter", "pendingreset", "drainrace", "closedch"}
INVARIANTS
  BatchWithinMax
