\* SPEC: PullMessages
\* Messages()/Next() with every proposed fix applied: all invariants hold.
\* Three Next calls, Drain from another goroutine, one disconnect/reconnect
\* (the server may or may not keep waiting pulls), late heartbeats allowed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxNext = 3
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"drain"}
  NextTimeout = FALSE
  ReportMissingHB = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = TRUE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "pendingreset", "clamp", "drainrace", "buffered", "unbounded", "fip"}
INVARIANTS
  TypeOK
  NoSlowConsumerDrop
  NoStatusDrop
  BatchWithinMax
  StopAfterRespected
  DrainKeepsBuffered
  NoOrphanedFetchSend
  NoPermanentStall
  NoDeadlock
