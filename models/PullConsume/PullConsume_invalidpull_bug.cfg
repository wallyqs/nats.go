\* SPEC: PullConsume
\* PULL-3 (side path): a missed-heartbeat re-pull processed between the
\* handler's delivered++ and its Stop asks for StopAfter - delivered = 0
\* messages; pull() rejects it and the user gets an "invalid argument"
\* error. Fix "stopafter" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 1
  StreamMsgs = 2
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {}
  AllowClose = FALSE
  ReqsOnDisconnect = "keep"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "pendingreset", "clamp", "drainrace", "closedch"}
INVARIANTS
  NoInvalidPull
