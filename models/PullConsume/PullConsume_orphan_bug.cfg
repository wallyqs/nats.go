\* SPEC: PullConsume
\* PULL-1: Stop while a re-pull is queued on fetchNext. pullMessages returns
\* on done, the second fetchNext send (handler checkPending or status
\* goroutine) blocks forever holding sub.Lock. Fix "orphan" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxReconnects = 1
  MaxExpires = 2
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"stop", "closed"}
  AllowClose = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = TRUE
  FastPull = TRUE
  Fixes = {"steal", "stopafter", "pendingreset", "clamp", "drainrace", "closedch"}
INVARIANTS
  NoOrphanedFetchSend
  NoDeadlock
