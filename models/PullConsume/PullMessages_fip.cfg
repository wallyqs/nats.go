\* SPEC: PullMessages
\* Passing: every fix including "fip" (PULL-10) with FastPull = FALSE: the
\* server may answer the pull being sent (its last message or its 408)
\* before pullMessages is back at fetchNext. checkPending no longer skips
\* while a pull is in progress, so the iterator never waits for the
\* heartbeat timer. Three Next calls, Drain, one reconnect (the server may
\* or may not keep waiting pulls). PullMessages_fip_bug.cfg shows the
\* stall without "fip" (StopAfter 1, no reconnect).
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxNext = 3
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"drain"}
  NextTimeout = FALSE
  ReportMissingHB = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = FALSE
  FastPull = FALSE
  Fixes = {"orphan", "steal", "pendingreset", "clamp", "drainrace", "buffered", "unbounded", "fip"}
INVARIANTS
  TypeOK
  NoSlowConsumerDrop
  BatchWithinMax
  DrainKeepsBuffered
  NoOrphanedFetchSend
  NoDeadlock
  NoSilentStall
  NoPermanentStall
