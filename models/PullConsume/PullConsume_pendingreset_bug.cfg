\* SPEC: PullConsume
\* PULL-4: with StopAfter < MaxMessages pending.msgCount is reset to
\* MaxMessages instead of the batch asked for; after the pull expires the
\* consumer has no pull anywhere and waits for the heartbeat timer. Fix
\* "pendingreset" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 1
  StreamMsgs = 2
  MaxReconnects = 0
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {}
  AllowClose = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "stopafter", "clamp", "drainrace", "closedch"}
INVARIANTS
  NoSilentStall
