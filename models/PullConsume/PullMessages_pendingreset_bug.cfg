\* SPEC: PullMessages
\* PULL-4 (Messages): StopAfter < MaxMessages, the pull expires partly
\* unfilled and Next waits with no pull anywhere until the heartbeat timer
\* fires (ErrNoHeartbeat by default). Fix "pendingreset" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 1
  StreamMsgs = 1
  MaxNext = 3
  MaxReconnects = 0
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {}
  NextTimeout = FALSE
  ReportMissingHB = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "clamp", "drainrace", "buffered", "unbounded"}
INVARIANTS
  NoSilentStall
