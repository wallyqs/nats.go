\* SPEC: PullConsume
\* Passing: every fix including "fip" (PULL-10) with FastPull = FALSE: the
\* server may answer the pull being sent (its last message or its 408)
\* before pullMessages is back at fetchNext. StopAfter(1) < MaxMessages(2),
\* one reconnect (the server may or may not keep waiting pulls), Stop and
\* Closed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 1
  StreamMsgs = 2
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"stop", "closed"}
  AllowClose = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = FALSE
  FastPull = FALSE
  Fixes = {"orphan", "steal", "stopafter", "pendingreset", "clamp", "drainrace", "closedch", "fip"}
INVARIANTS
  TypeOK
  StopAfterRespected
  BatchWithinMax
  NoInvalidPull
  NoOrphanedFetchSend
  ClosedMeansDone
  NoDeadlock
  NoSilentStall
  NoPermanentStall
