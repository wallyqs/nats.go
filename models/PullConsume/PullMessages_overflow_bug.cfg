\* SPEC: PullMessages
\* PULL-5: after a reconnect Next resets pending to 0 and re-pulls a full
\* batch while the channel still holds messages / old pulls are alive: the
\* ChanSubscription overflows and nats.go drops messages (slow consumer).
\* Fixes "buffered" and "unbounded" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxNext = 3
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {}
  NextTimeout = FALSE
  ReportMissingHB = FALSE
  ReqsOnDisconnect = "keep"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "pendingreset", "clamp", "drainrace"}
INVARIANTS
  NoSlowConsumerDrop
