\* SPEC: PullMessages
\* Passing: StopAfter(1) < MaxMessages(2) with every fix: never more than
\* StopAfter messages and no stall waiting for the heartbeat timer.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 1
  StreamMsgs = 2
  MaxNext = 3
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"stop"}
  NextTimeout = FALSE
  ReportMissingHB = FALSE
  ReqsOnDisconnect = "keep"
  LateHeartbeats = FALSE
  FastPull = TRUE
  Fixes = {"orphan", "steal", "pendingreset", "clamp", "drainrace", "buffered", "unbounded"}
INVARIANTS
  TypeOK
  StopAfterRespected
  BatchWithinMax
  NoSlowConsumerDrop
  NoOrphanedFetchSend
  NoDeadlock
  NoSilentStall
  NoPermanentStall
