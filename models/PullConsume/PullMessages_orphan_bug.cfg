\* SPEC: PullMessages
\* PULL-1 (Messages): during Drain Next keeps calling checkPending after
\* pullMessages returned; the second fetchNext send blocks forever while
\* Next holds sub.Lock. Fix "orphan" removed.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  Thresh = 1
  StopAfter = 0
  StreamMsgs = 2
  MaxNext = 3
  MaxReconnects = 1
  MaxExpires = 1
  MaxHBMsgs = 0
  MaxHBFires = 1
  ErrsCap = 10
  StatusCap = 10
  UserOps = {"drain"}
  NextTimeout = FALSE
  ReportMissingHB = FALSE
  ReqsOnDisconnect = "either"
  LateHeartbeats = TRUE
  FastPull = TRUE
  Fixes = {"steal", "pendingreset", "clamp", "drainrace", "buffered", "unbounded"}
INVARIANTS
  NoOrphanedFetchSend
